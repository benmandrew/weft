[mypy]
python_version = 3.12
strict = True
pretty = True
# tools/ is not part of the package and is not on mypy's path the way src/ is
# on the shell's, so mypy_path names it rather than relying on PYTHONPATH.
mypy_path = src
files = src/wordchain, tools

# nltk, wordfreq and pyvis ship no type information, and none of the three has
# stubs on typeshed. Everything crossing those boundaries is annotated by hand
# at the call site instead.
[mypy-nltk.*]
ignore_missing_imports = True

[mypy-wordfreq.*]
ignore_missing_imports = True

[mypy-pyvis.*]
ignore_missing_imports = True

# networkx has no py.typed and no stubs in nixpkgs, so the graph types are
# checked at the boundaries in graph.py rather than through the library.
[mypy-networkx.*]
ignore_missing_imports = True
